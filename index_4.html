<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard SEO — revisio.fr</title>
<style>
:root{--ink:#192229;--ink2:#716E76;--muted:#96939E;--v:#663466;--plum:#4C274C;--sky:#A0D1FF;--sky2:#A9D0EC;--vbg:#EBE8FA;--green:#1D7A4F;--line:#DAD8E8;--bg:#474E54;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header{background:var(--plum);color:var(--sky);border-radius:20px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:700;color:var(--sky)}
header .sub{color:var(--sky);font-size:12.5px;margin-top:4px}
.pill{display:inline-block;background:#663466;color:var(--sky);border-radius:999px;padding:2px 10px;font-size:11.5px;margin-top:8px}
.lang button{background:transparent;border:1px solid var(--sky);color:var(--sky);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
.lang button.on{background:#663466;border-color:var(--sky)}
.hero{margin:16px 0 4px;font-size:17px;font-weight:600;color:#FFFFFF}
.hero b{color:var(--sky)}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.tabs button.on{background:#663466;border-color:var(--sky);color:#fff}
.tabs small{display:block;font-weight:400;font-size:11.5px;opacity:.8}
.page{display:none}.page.on{display:block}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .l{color:var(--ink2);font-size:12px}
.tile .v{font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .n{color:var(--muted);font-size:11.5px;margin-top:2px}
.tile.pos .v{color:var(--green)}
.tile.orange .l{color:#F79400;font-weight:600}
.sect{color:var(--sky2);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;margin:4px 0 10px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 2px;font-size:14.5px}
.card .q{color:var(--ink2);font-size:12.5px;margin:0 0 8px}
.card .read{color:var(--ink2);font-size:12.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;fill:var(--ink2);font-size:11px}
svg .val{fill:var(--ink);font-weight:600}
ul.facts{margin:6px 0 0;padding-left:18px}ul.facts li{margin:3px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 8px;font-size:12.5px;color:var(--sky2)}
.filters select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
.tblwrap{overflow:auto;max-height:560px;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--vbg);color:var(--ink);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{white-space:normal;min-width:400px;color:var(--ink2)}
td a{color:var(--v);text-decoration:none}td a:hover{text-decoration:underline}
.bar{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.bar span.b{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:#1D7A4F}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px}
.tag.r{background:#ECEAF8;color:#534AB7}.tag.t{background:#EEF5E4;color:#4E7A1B}
.neg{color:#6F326F}
.note{color:var(--ink2);font-size:12.5px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note b{color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--plum);color:#fff;border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.4;max-width:300px;opacity:0;transition:opacity .08s;z-index:9}
footer{color:var(--sky2);font-size:11.5px;margin-top:18px;text-align:center}
@media (max-width:520px){.tile .v{font-size:20px}header h1{font-size:17px}}
</style>
</head>

[1,5,10,13,15,20].forEach(p=>el("text",{x:sx(p),y:H-12,"text-anchor":"middle"},s,p));el("text",{x:m.l+iw/2,y:H,"text-anchor":"middle"},s,"Position");
